name: Spotify Playlist Refresh

on:
  # 00:03 UTC = 01:03 in Salzburg (02:03 in summer time).
  # A few minutes past the hour avoids GitHub's busiest :00 slot, which causes long delays.
  schedule:
    - cron: '3 0 * * *'

  # Manual trigger (from the GitHub UI)
  workflow_dispatch:

permissions:
  contents: write   # lets the run commit history/selections.csv back to the repo

jobs:
  refresh-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install spotify-web-api-node

    - name: Refresh Spotify Playlist
      run: node index.js
      env:
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        DAILY_PLAYLIST_ID: ${{ secrets.DAILY_PLAYLIST_ID }}
        EVERYDAY_PLAYLIST_ID: ${{ secrets.EVERYDAY_PLAYLIST_ID }}
        A_LIST_PLAYLIST_ID: ${{ secrets.A_LIST_PLAYLIST_ID }}
        B_LIST_PLAYLIST_ID: ${{ secrets.B_LIST_PLAYLIST_ID }}
        FAVES_2025_PLAYLIST_ID: ${{ secrets.FAVES_2025_PLAYLIST_ID }}
        SEASON_PLAYLIST_ID: ${{ secrets.SEASON_PLAYLIST_ID }}
        A_LIST_COUNT: ${{ secrets.A_LIST_COUNT || '10' }}
        B_LIST_COUNT: ${{ secrets.B_LIST_COUNT || '5' }}
        FAVES_2025_COUNT: ${{ secrets.FAVES_2025_COUNT || '10' }}
        SEASON_COUNT: ${{ secrets.SEASON_COUNT || '10' }}

    # Saves the day's picks. The daily commit also keeps the repo "active",
    # so GitHub never auto-disables the schedule after 60 quiet days.
    - name: Commit selection history
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
        git add history/selections.csv
        git diff --cached --quiet && exit 0
        git commit -m "Log daily selections $(TZ=Europe/Vienna date +%F)"
        git pull --rebase
        git push
